# Per-domain Slurm resources for the TRAINING array, consumed by experiments/launch.py. A domain inherits the `defaults` block for every field it does not set; `{}` takes all of them. Which sbatch flag each field becomes is `pipeline.sbatch_resource_opts`, and `sbatch_extra` is a list passed verbatim.
#
# Validation-array resources are configured separately in experiments/configs/slurm-resources-validation.yaml.

defaults:
  time: "04:00:00"
  mem: "8G"
  cpus: "8"
  gres: "shard:4"

blocks-3:
  gres: "shard:12"
  time: "24:00:00"
delivery:
  gres: "shard:6"
driverlog:
  time: "12:00:00"
  gres: "shard:6"
gripper:
  time: "12:00:00"
hanoi:
  gres: "shard:12"
  time: "24:00:00"
logistics:
  time: "08:00:00"
miconic:
  gres: "shard:12"
  time: "24:00:00"
n-puzzle: {}
satellite:
  time: "12:00:00"
  gres: "shard:10"
sokoban:
  time: "06:00:00"
  mem: "32G"
  gres: "shard:6"
sokoban-pull:
  gres: "shard:6"
spanner:
  time: "06:00:00"
  gres: "shard:6"
visitall:
  time: "08:00:00"
  gres: "shard:8"
