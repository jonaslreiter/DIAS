# Per-domain Slurm resources for the TRAINING array, consumed by experiments/launch.py. A domain inherits the `defaults` block for every field it does not set; `{}` takes all of them. Which sbatch flag each field becomes is `pipeline.sbatch_resource_opts`, and `sbatch_extra` is a list passed verbatim.
#
# Validation-array resources are configured separately in experiments/configs/slurm-resources-validation.yaml.
#
# Some seeds train far slower than others of the same domain: the step rate falls over the run, to 0.15 steps per second on one MLP-effects hanoi seed that took 18.6 hours where the domain's median is 2. The times leave room for that, since a run that times out starts over: at least 24 hours, which one of the suite's MLP-effects sokoban seeds needs where its others take two.

defaults:
  time: "24:00:00"
  mem: "8G"
  cpus: "8"
  gres: "shard:4"

blocks-3:
  gres: "shard:12"
  time: "36:00:00"
delivery:
  gres: "shard:6"
driverlog:
  gres: "shard:6"
gripper: {}
hanoi:
  gres: "shard:12"
  time: "48:00:00"
logistics: {}
miconic:
  gres: "shard:12"
  time: "36:00:00"
n-puzzle: {}
satellite:
  gres: "shard:10"
satellite-recal:
  gres: "shard:10"
sokoban:
  mem: "32G"
  gres: "shard:6"
sokoban-pull:
  gres: "shard:6"
spanner:
  gres: "shard:6"
visitall:
  gres: "shard:8"
