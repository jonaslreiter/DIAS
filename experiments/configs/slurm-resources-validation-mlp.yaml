# Per-domain Slurm resources for the validation array of MLP-effects experiments (experiments/launch.py). Same schema as slurm-resources.yaml, resolved on its own.
#
# As in slurm-resources-validation.yaml, one worker per CPU, each limited to an equal share of `mem`; the network runs on a GPU shard. Cost follows how permissive the learned preconditions are. In the camera-ready suite of October 2026 most domains scored all three problems in a quarter of an hour at most. Satellite and satellite-recal took 13 to 24 hours with states of up to 8 GB, and one driverlog seed in ten took 18 hours with every state of its largest problem needing 20 GB, scored seven at a time; the other nine took minutes. The network's peak GPU memory, measured at 16 times the default batch, was 1.7 GB in satellite, 1.4 in driverlog, 0.7 in logistics, 0.5 in sokoban, sokoban-pull and visitall and 0.25 at most elsewhere, so `gres` holds that and the CUDA context.

defaults:
  time: "02:00:00"
  mem: "16G"
  cpus: "16"
  gres: "shard:1"

blocks-3: {}
delivery: {}
driverlog:
  time: "1-00:00:00"
  mem: "180G"
  gres: "shard:2"
gripper: {}
hanoi: {}
logistics:
  gres: "shard:2"
miconic: {}
n-puzzle: {}
satellite:
  time: "30:00:00"
  mem: "32G"
  gres: "shard:3"
satellite-recal:
  time: "30:00:00"
  mem: "32G"
  gres: "shard:3"
sokoban: {}
sokoban-pull: {}
spanner: {}
visitall: {}
