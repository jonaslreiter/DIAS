# Per-domain Slurm resources for the VALIDATION array of an MLP-effects experiment, which `pipeline.validation_resources_file` picks for that validator in launch.py and launch_threshold_validation.py. Same schema as experiments/configs/slurm-resources-validation.yaml, resolved on its own.
#
# The MLP-effects validator grounds the learned preconditions in every sampled state, so its cost follows how permissive they are rather than the instance alone, and it grounds across every CPU the task is allocated. The times are generous: the 500 walk states take the DIAS validator alone 30 to 45 minutes in most domains, longer where a learned schema has more parameters than the action, and this one also runs the network on every grounding; a task that runs out of time keeps the states it scored, and `launch.py --validate-only --resume` continues from them. Memory bounds the worker count: a worker holds its ground actions until it is replaced after `--states-per-worker` states, over 20 GB on driverlog test-3 for a permissive schema.

defaults:
  time: "08:00:00"
  mem: "32G"
  cpus: "16"

blocks-3:
  time: "2-00:00:00"
delivery: {}
driverlog:
  time: "3-00:00:00"
  mem: "180G"
gripper: {}
hanoi: {}
logistics:
  time: "12:00:00"
miconic: {}
n-puzzle: {}
satellite: {}
satellite-recal: {}
sokoban: {}
sokoban-pull: {}
spanner:
  time: "24:00:00"
  mem: "64G"
  cpus: "32"
visitall:
  time: "2-00:00:00"
  mem: "64G"
  cpus: "32"
