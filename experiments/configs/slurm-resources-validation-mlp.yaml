# Per-domain Slurm resources for the validation array of MLP-effects experiments (experiments/launch.py). Same schema as slurm-resources.yaml, resolved on its own.
#
# As in slurm-resources-validation.yaml, one worker per CPU, each limited to an equal share of `mem`; the network runs on a GPU shard. Cost follows how permissive the learned preconditions are, so domains whose schemas ground many actions per state get more time and memory.

defaults:
  time: "08:00:00"
  mem: "32G"
  cpus: "16"
  gres: "shard:4"

blocks-3:
  time: "2-00:00:00"
delivery: {}
driverlog:
  time: "3-00:00:00"
  mem: "180G"
gripper: {}
hanoi: {}
logistics:
  time: "12:00:00"
miconic: {}
n-puzzle: {}
satellite: {}
satellite-recal: {}
sokoban: {}
sokoban-pull: {}
spanner:
  time: "24:00:00"
  mem: "64G"
  cpus: "32"
visitall:
  time: "2-00:00:00"
  mem: "64G"
  cpus: "32"
