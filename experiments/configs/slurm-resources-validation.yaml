# Per-domain Slurm resources for the validation array of DIAS and L1 experiments (experiments/launch.py); MLP-effects and noise experiments use slurm-resources-validation-mlp.yaml and slurm-resources-validation-noise.yaml. Same schema as slurm-resources.yaml, resolved on its own.
#
# Validation runs on CPU, one worker per CPU, each limited to an equal share of `mem`; a state that needs more than its share runs with fewer states beside it, so `mem` must hold the largest single state, and more of it buys speed. A task that runs out of time keeps the states it scored, and `launch.py --validate-only --resume` continues it.
#
# Sized on the camera-ready suite of October 2026, about 2,080 clean validations with a median of a minute. Some of hanoi's ablation seeds learn domains that ground far more than any other's, with states of up to 6.4 GB that 8 GB scores one at a time or not at all, so hanoi gets the memory to score several at once. Blocks-3's states need up to 5 GB, which 8 GB scores one at a time. Satellite takes several hours where its schemas are permissive, and its largest state needed 9.4 GB; no other domain's needed more than 1.5.

defaults:
  time: "02:00:00"
  mem: "8G"
  cpus: "8"

blocks-3:
  time: "04:00:00"
delivery: {}
driverlog: {}
gripper: {}
hanoi:
  time: "16:00:00"
  mem: "32G"
logistics: {}
miconic: {}
n-puzzle: {}
satellite:
  time: "08:00:00"
  mem: "12G"
satellite-recal:
  time: "04:00:00"
sokoban: {}
sokoban-pull: {}
spanner: {}
visitall: {}
