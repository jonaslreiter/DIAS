# Per-domain Slurm resources for the validation array of DIAS, noise and L1 experiments (experiments/launch.py); MLP-effects experiments use slurm-resources-validation-mlp.yaml. Same schema as slurm-resources.yaml, resolved on its own.
#
# Validation runs on CPU, one worker per CPU, each limited to an equal share of `mem`. A task that runs out of time keeps the states it scored, and `launch.py --validate-only --resume` continues it.

defaults:
  time: "4-00:00:00"
  mem: "16G"
  cpus: "2"

blocks-3: {}
delivery: {}
driverlog: {}
gripper: {}
hanoi: {}
logistics: {}
miconic: {}
n-puzzle: {}
satellite: {}
satellite-recal: {}
sokoban: {}
sokoban-pull: {}
spanner: {}
visitall: {}
