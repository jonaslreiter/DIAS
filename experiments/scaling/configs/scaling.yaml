# The overlay of the scaling study, composed after configs/main.yaml and pddl/<domain>/config.yaml: the same number of transitions and batch size in every domain, and no validation, logging or checkpoints.

data:
  init_args:
    min_per_action_train: 100
    min_per_action_valid: 50
    max_per_action_train: 100
    max_per_action_valid: 50
    batch_size: 200
    num_workers: 0

trainer:
  limit_val_batches: 0
  num_sanity_val_steps: 0
  logger: false
  enable_checkpointing: false
  enable_progress_bar: false
  enable_model_summary: false
  # benchmark.py sets it to the warm-up and measured steps.
  max_steps: 120
