# Per-domain training overrides for 'driverlog'.
# Composed after configs/main.yaml, e.g.:
#   dias-train fit --config configs/main.yaml --config pddl_files/driverlog/config.yaml
# Holds domain-specific data (sampling) and model overrides.
data:
  init_args:
    min_per_label_train: 2000
    min_per_label_valid: 1000
    max_per_label_train: 3000
    max_per_label_valid: 1500
