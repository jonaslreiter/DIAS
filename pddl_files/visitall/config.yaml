# Per-domain training overrides for 'visitall'.
# Composed after configs/main.yaml, e.g.:
#   dias-train fit --config configs/main.yaml --config pddl_files/visitall/config.yaml
# Holds domain-specific data (sampling) and model overrides.
data:
  init_args:
    min_per_label_train: 100
    min_per_label_valid: 50
    max_per_label_train: 1000
    max_per_label_valid: 500
model:
  init_args:
    loss_weight_schedule:
      aux_loss_weight:
        type: linear
        keypoints: { 0: 1.0 }
