# Per-domain training overrides for 'spanner'.
# Composed after configs/main.yaml, e.g.:
#   dias-train fit --config configs/main.yaml --config pddl_files/spanner/config.yaml
# Holds domain-specific data (sampling) and model overrides.
data:
  init_args:
    min_per_label_train: 200
    min_per_label_valid: 100
    max_per_label_train: 1000
    max_per_label_valid: 500
