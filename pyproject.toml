[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "dias"
description = "Differentiable induction of lifted STRIPS action schemas from state transitions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jonas Reiter" },
    { name = "Jakob Elias Gebler" },
]
keywords = [
    "classical planning",
    "action model learning",
    "PDDL",
    "STRIPS",
    "graph neural networks",
    "neuro-symbolic",
]
classifiers = [
    # No license classifier: PEP 639 supersedes it with the `license` expression
    # above, and setuptools now refuses a project that carries both.
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Lower bounds are the oldest release the code is written against; the upper
# bound on pymimir is a compatible-release clause because it is pre-1.0 and
# its parser API is what every PDDL path here depends on.
dependencies = [
    "torch>=2.1",
    "pymimir~=0.13.62",
    "lightning>=2.2",
    "jsonargparse[signatures]>=4.27.7",
    "torch-geometric>=2.5",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "wandb>=0.19",
    "tqdm>=4.65",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/jonaslreiter/DIAS"
Repository = "https://github.com/jonaslreiter/DIAS"
Paper = "https://arxiv.org/abs/2605.13282"
Issues = "https://github.com/jonaslreiter/DIAS/issues"

[project.scripts]
dias-train = "dias.main:main"

# PEP 735 groups rather than an extra: extras are published in the wheel's
# metadata, which would make `pip install dias[dev]` part of the public API.
# Groups stay local to the repository. Needs pip >= 25.1.
[dependency-groups]
dev = ["pytest>=8", "coverage>=7", "black>=24", "isort>=5.13", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "dias.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
# Without this, black targets the newest Python it knows and warns that the
# running interpreter cannot verify its own output.
target-version = ["py310"]
extend-exclude = "/(submodules|\\.venv-delivery)/"

[tool.isort]
profile = "black"
src_paths = ["src", "tests", "scripts", "scaling"]
extend_skip_glob = ["submodules/*", "*/.venv-delivery/*"]
