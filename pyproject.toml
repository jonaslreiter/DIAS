[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

# Installed from a clone; the name `dias` on PyPI is another package.
[project]
name = "dias"
description = "Differentiable induction of lifted STRIPS action schemas from state transitions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jonas Reiter" },
    { name = "Jakob Elias Gebler" },
]
dependencies = [
    "torch>=2.1",
    "pymimir~=0.13.62",
    "lightning>=2.2",
    "jsonargparse[signatures]>=4.49,<5",
    "torch-geometric>=2.5",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "wandb>=0.19",
    "tqdm>=4.65",
]
dynamic = ["version"]

[project.scripts]
dias = "dias.main:main"

# pip install -e . --group dev (pip >= 25.1)
[dependency-groups]
dev = ["pytest>=8", "coverage>=7", "black>=24", "isort>=5.13", "pre-commit>=3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "dias.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*args parameter is intended.*",
    # Lightning 2.6 calling jsonargparse APIs deprecated in 4.49.
    "ignore:(?s).*deprecated in v4.49.0.*",
    "ignore:(?s).*only one JsonargparseDeprecationWarning per type.*",
]

[tool.black]
target-version = ["py310"]

[tool.isort]
profile = "black"
src_paths = ["src", "tests", "experiments", "experiments/scaling"]
extend_skip = ["logs", "local"]
