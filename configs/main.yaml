# DIAS base training config for single-domain runs.
#
# Switch domains by editing `data.init_args.{domain_path, problem_path}`.
# For the noise ablation, compose configs/experiments/noise.yaml on top.

seed_everything: 43
experiment: "dias"

model:
  class_path: dias.models.DIAS
  init_args:
    object_dim: 32
    num_slots: 5
    force_action_args: false
    per_action_slots: false
    learn_preconditions: true
    successor_relations: true
    random_node_embeddings: true
    pcgrad_dyn_clip: true
    learning_rate: 0.005
    aux_loss_weight: 0.2
    use_slot_weights: true
    use_precondition_loss: true
    use_effect_loss: true
    use_pcgrad: true
    # Tau: the root degree of the relaxed precondition product. Anneals from
    # the geometric mean (1.0) toward the exact product (0.0).
    gmean_temperature:
      class_path: dias.schedules.Exponential
      init_args:
        start: 1.0
        floor: 0.0
        factor: 0.1
        every: 500

data:
  class_path: dias.data.datamodule.PddlGraphDataModule
  init_args:
    # ── Domain / problem ────────────────────────────────────────────────
    domain_path: pddl/gripper/domain.pddl
    problem_path: pddl/gripper/train.pddl

    # ── Sampling ────────────────────────────────────────────────────────
    min_per_label_train: 100
    min_per_label_valid: 50
    max_per_label_train: 1000
    max_per_label_valid: 500
    num_train: null
    num_valid: null
    max_steps: 1000000
    seed: 43
    include_statics: true
    action_arguments: false
    strips_plus_actions: false
    batch_size: 200

    # `random`     — shuffled DataLoader over the split (one pass per epoch).
    # `stratified` — infinite IterableDataset; action-balanced batches drawn
    #                with replacement. Bound length via trainer.max_steps /
    #                limit_train_batches / limit_val_batches.
    batch_sampling_strategy: stratified
    shuffle_train: true
    num_workers: 0

trainer:
  # Weights & Biases. `entity: null` means "whichever account is logged in"
  # (or $WANDB_ENTITY), so a clone of this repository logs to its own account
  # and needs no edit here. To train without W&B at all, either
  #   --trainer.logger=false          (no logging)
  #   WANDB_MODE=offline dias-train   (log to logs/wandb, upload later)
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      save_dir: logs
      project: dias
      entity: null

  # The learned schema, logged as W&B custom charts rather than as images.
  # Raise log_every_n_validations to log fewer of them; the final schema is
  # logged when training ends either way.
  callbacks:
    - class_path: dias.reporting.callback.SchemaChartCallback
      init_args:
        log_every_n_validations: 20

  max_steps: 10000
  val_check_interval: 50
  limit_val_batches: 10
  accelerator: gpu
  devices: 1
