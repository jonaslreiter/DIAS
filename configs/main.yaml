# DIAS base training config: the paper's setup for a single domain, minus the domain.
#
# `dias.models.DIAS` and `dias.data.datamodule.PddlGraphDataModule` already default to the paper's full model with no noise, so what is left here is the run itself (how long, on what hardware, logged where) and the few values a class cannot choose. On top of it, `pddl/<domain>/config.yaml` carries the domain and its tuning, and its siblings here (`experiment-mlp.yaml`, `experiment-noise.yaml`, `ablation-*.yaml`) the MLP-effects model, the noise setup and the ablations; command-line `--key=value` overrides win over all of them. `dias fit --model.help dias.models.DIAS` and `--data.help dias.data.datamodule.PddlGraphDataModule` describe every argument set here, and each run saves the config it fully resolved to.
#
# This config names no domain: `domain_path` and `problem_path` have no default anywhere, so a run says which one it trains on:
#
#   dias fit --config configs/main.yaml --config pddl/gripper/config.yaml

model:
  class_path: dias.models.DIAS
  init_args:
    num_slots: 5
    precondition_tau:
      class_path: dias.schedules.Exponential
      init_args:
        start: 1.0
        floor: 0.0
        factor: 0.1
        every: 500

data:
  class_path: dias.data.datamodule.PddlGraphDataModule
  init_args:
    min_per_action_train: 100
    min_per_action_valid: 50
    max_per_action_train: 1000
    max_per_action_valid: 500

trainer:
  # `entity: null` means whichever account is logged in (or $WANDB_ENTITY), so a clone of this repository logs to its own and needs no edit here. To train without W&B, either `--trainer.logger=false` or `WANDB_MODE=offline`.
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      save_dir: logs
      project: dias
      entity: null

  callbacks:
    - class_path: dias.reporting.callback.SchemaChartCallback
      init_args:
        log_every_n_validations: 20

  max_steps: 10000
  val_check_interval: 50
  limit_val_batches: 10
  accelerator: gpu
  devices: 1
  # A run repeats exactly from (domain, seed).
  deterministic: true
