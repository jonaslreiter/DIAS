# Per-domain Slurm resources consumed by scripts/launch.py.
#
# Each domain inherits `defaults` for any field it does not set. Fields:
#   time  -> --time   (HH:MM:SS)
#   mem   -> --mem
#   cpus  -> --cpus-per-task
#   gres  -> --gres=<value>   (e.g. "gpu:1", or a GPU shard like "shard:8")
#   sbatch_extra -> list of raw directives passed verbatim, e.g.
#                   ["--partition=gpu", "--account=dias", "--gres=shard:8"]
#
# Fill in real per-domain values as needed; an empty {} means "use defaults".

defaults:
  time: "02:00:00"
  mem: "8G"
  cpus: "4"
  gres: "shard:4"

blocks-3: {}
delivery:
  time: "03:00:00"
  gres: "shard:8"
driverlog:
  time: "04:00:00"
  gres: "shard:8"
gripper: {}
hanoi: {}
logistics:
  time: "03:00:00"
miconic: {}
n-puzzle: {}
satellite:
  time: "06:00:00"
  gres: "shard:12"
sokoban:
  time: "03:00:00"
  mem: "12G"
  gres: "shard:8"
sokoban-pull:
  gres: "shard:8"
spanner:
  time: "03:00:00"
  gres: "shard:8"
visitall:
  gres: "shard:8"
