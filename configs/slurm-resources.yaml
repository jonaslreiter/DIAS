# Per-domain Slurm resources consumed by scripts/launch.py.
#
# Each domain inherits `defaults` for any field it does not set. Fields:
#   time  -> --time   (HH:MM:SS)
#   mem   -> --mem
#   cpus  -> --cpus-per-task
#   gres  -> --gres=<value>   (e.g. "gpu:1", or a GPU shard like "shard:8")
#   sbatch_extra -> list of raw directives passed verbatim, e.g.
#                   ["--partition=gpu", "--account=dias", "--gres=shard:8"]
#
# Fill in real per-domain values as needed; an empty {} means "use defaults".

defaults:
  time: "10:00:00"
  mem: "32G"
  cpus: "8"
  gres: "shard:8"

blocks-3:
  time: "02:00:00"
  mem: "4G"
  cpus: "4"
  gres: "shard:4"
delivery: {}
driverlog: {}
gripper:
  time: "02:00:00"
  mem: "4G"
  cpus: "4"
  gres: "shard:4"
hanoi: {}
logistics: {}
miconic: {}
n-puzzle: {}
satellite: {}
sokoban: {}
sokoban-pull: {}
spanner: {}
visitall: {}
