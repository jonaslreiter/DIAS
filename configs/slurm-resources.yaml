# Per-domain Slurm resources consumed by scripts/launch.py.
#
# Each domain inherits `defaults` for any field it does not set. Fields:
#   time  -> --time   (HH:MM:SS)
#   mem   -> --mem
#   cpus  -> --cpus-per-task
#   gres  -> --gres=<value>   (e.g. "gpu:1", or a GPU shard like "shard:8")
#   sbatch_extra -> list of raw directives passed verbatim, e.g.
#                   ["--partition=gpu", "--account=dias", "--gres=shard:8"]
#
# Fill in real per-domain values as needed; an empty {} means "use defaults".
#
# These configure the TRAINING array. Validation-array resources are configured
# separately in configs/slurm-resources-validation.yaml.

defaults:
  time: "04:00:00"
  mem: "8G"
  cpus: "8"
  gres: "shard:4"

blocks-3: {}
delivery:
  gres: "shard:6"
driverlog:
  gres: "shard:6"
gripper: {}
hanoi: {}
logistics: {}
miconic: {}
n-puzzle: {}
satellite:
  time: "12:00:00"
  gres: "shard:10"
sokoban:
  time: "06:00:00"
  mem: "32G"
  gres: "shard:6"
sokoban-pull:
  gres: "shard:6"
spanner:
  gres: "shard:6"
visitall:
  gres: "shard:8"
