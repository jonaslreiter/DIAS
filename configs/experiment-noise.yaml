# Noisy training states, their atom counts per state, so 1.0 each is 4 flips per transition; observation noise in L_adj; smaller batches.
model:
  init_args:
    observation_noise: 0.1

data:
  init_args:
    noise:
      class_path: dias.data.noise.ExpectedCount
      init_args:
        removed_atoms: 1.0
        added_atoms: 1.0
    batch_size: 50
