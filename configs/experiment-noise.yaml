# Noise experiments: input noise plus two training adjustments, the same for every domain. Everything else is the clean setup, the tau schedule, the derivation threshold and the sampling bounds included.
#
# The atom counts are per state, and both states of a transition are corrupted, so 1.0 / 1.0 is 4 flips per transition, and 1, 2, 4 and 8 flips are budgets of 0.25, 0.5, 1.0 and 2.0.
model:
  init_args:
    # A corrupted atom cannot be predicted, and the plain cross-entropy lets one cost without bound; read as flipped with this probability, each costs at most -log(0.1), which lets tau anneal to the exact precondition product as on clean data.
    observation_noise: 0.1

data:
  init_args:
    noise:
      class_path: dias.data.noise.ExpectedCount
      init_args:
        removed_atoms: 1.0
        added_atoms: 1.0
    # Smaller batches, as the paper's noise runs had, to limit the effect of PCGrad's projection.
    batch_size: 50
