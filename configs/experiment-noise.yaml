# Noise experiments corrupt the training states and use observation noise in L_adj and smaller batches. The atom counts are per state, so 1.0 each is 4 flips per transition.
model:
  init_args:
    observation_noise: 0.1

data:
  init_args:
    noise:
      class_path: dias.data.noise.ExpectedCount
      init_args:
        removed_atoms: 1.0
        added_atoms: 1.0
    batch_size: 50
