# Ablation overlay: drop L_eff (the minimal-effects auxiliary term).
# Composed last on top of main.yaml, e.g.:
#   dias-train fit --config configs/main.yaml \
#       --config pddl/<domain>/config.yaml \
#       --config configs/experiments/ablation-no-effect-loss.yaml
model:
  init_args:
    use_effect_loss: false
