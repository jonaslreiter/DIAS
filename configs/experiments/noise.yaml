# Noise experiment overlay: expected-count (Poisson flip-budget) input noise,
# plus the training adjustments of the paper's noise experiments (App. A.4.2):
#
#   * per-action minimum sample count floored at Nmin = 200 (domains that
#     already sample more keep their per-domain value — hence the *_floor
#     knobs, since this overlay is composed after pddl/<domain>/config.yaml),
#   * batch size reduced to 50, to limit the effect of the gradient projection,
#   * a floor of 0.1 on the precondition-aggregation parameter tau, since the
#     true product of Eq. (8) is too strict a precondition check under noise.
#     `gmean_offset` is added to the scheduled value, so the schedule is scaled
#     by 0.9 and the effective tau decays 1.0 -> 0.1 at the same rate as the
#     clean setup (0.19 at step 500, approaching the 0.1 floor afterwards).
#
# The matching schema-derivation threshold of 0.75 (Eq. 14) is a validation-time
# setting, not a training one: scripts/launch.py applies it automatically for
# --experiment-type noise (VALIDATION_THRESHOLD).
#
# Composed last. Override the atom budgets per launch to sweep noise levels, e.g.:
#   scripts/launch.py --experiment-type noise \
#       --set data.init_args.expected_added_atoms=2 \
#       --set data.init_args.expected_removed_atoms=2
#
# `noise_model: expected_count` requires edge_add_ratio / edge_remove_ratio to stay
# at 0.0 (enforced by the datamodule). Static predicates are left untouched.
model:
  init_args:
    gmean_offset: 0.1
    gmean_temperature:
      class_path: dias.schedules.Exponential
      init_args:
        v0: 0.9
        vT: 0.09
        T: 500

data:
  init_args:
    noise_model: expected_count
    edge_remove_ratio: 0.0
    edge_add_ratio: 0.0
    expected_removed_atoms: 1.0
    expected_added_atoms: 1.0
    noise_on_fluents_only: true
    min_per_label_train_floor: 200
    min_per_label_valid_floor: 100
    batch_size: 50
