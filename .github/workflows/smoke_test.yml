name: Smoke test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  smoke:
    name: 10-step training smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and dependencies
        run: pip install -e .

      - name: Run 10-step smoke test (blocks_3, CPU, CSV logger)
        run: |
          dias-train fit --config configs/smoke_test.yaml
