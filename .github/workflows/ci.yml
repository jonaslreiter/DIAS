name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "black>=24" "isort>=5.13"
      - run: black --check .
      - run: isort --check-only .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The CPU wheels: torch's default index pulls the CUDA build, which is
      # gigabytes of driver payload a test runner has no card for.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e . --group dev
      - run: pytest -q
