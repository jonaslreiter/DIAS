name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The dev group rather than a floor spelled out again here, so this job and the pre-commit hooks are the same two tools. `--group` without a project installs the group alone, which keeps torch out of a formatting job.
      - run: pip install --upgrade pip
      - run: pip install --group dev
      - run: black --check .
      - run: isort --check-only .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The CPU wheels: torch's default index pulls the CUDA build, which is
      # gigabytes of driver payload a test runner has no card for.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e . --group dev
      - run: pytest -q

  # Can an empty environment install this project? The test job cannot answer
  # that: it installs in editable mode, with the dev group, from a tree that
  # already has `src/` importable. This one installs the way a new user does
  # and then runs the package from somewhere else entirely.
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install into an empty virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/fresh"
          "$RUNNER_TEMP/fresh/bin/pip" install --upgrade pip
          # torch from the CPU index, as above. Everything else -- pymimir's
          # wheel for this interpreter above all -- is resolved by the install
          # below, which is the point of this job.
          "$RUNNER_TEMP/fresh/bin/pip" install torch --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/fresh/bin/pip" install .
      - name: The console script exists
        run: "$RUNNER_TEMP/fresh/bin/dias --help"
      - name: The package imports from outside the source tree
        # From another directory, so a module missing from the installed copy
        # cannot be covered up by `src/` sitting in the working directory.
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/fresh/bin/python" -c "
          import dias, dias.main, dias.models.dias, dias.validation.dias_validate
          print('dias', dias.__version__, 'imports from', dias.__file__)
          "
