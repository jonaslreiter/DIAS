name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade pip
      - run: pip install --group dev
      - run: black --check .
      - run: isort --check-only .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e . --group dev
      - run: pytest -q

  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install into an empty virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/fresh"
          "$RUNNER_TEMP/fresh/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/fresh/bin/pip" install torch --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/fresh/bin/pip" install .
      - name: The console script exists
        run: "$RUNNER_TEMP/fresh/bin/dias --help"
      - name: The package imports from outside the source tree
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/fresh/bin/python" -c "
          import dias, dias.main, dias.models.dias, dias.validation.dias
          print('dias', dias.__version__, 'imports from', dias.__file__)
          "
