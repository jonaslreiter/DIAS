# Per-domain config for 'blocks-3', composed after configs/main.yaml:
#   dias fit --config configs/main.yaml --config pddl/blocks-3/config.yaml
#
# The paths below are what make that command train blocks-3 rather than
# whichever domain the base config happens to name. They are this folder's
# standard filenames, which the test suite checks.
#
# Sampling stays at main.yaml's default; only the auxiliary weight is tuned.
data:
  init_args:
    domain_path: pddl/blocks-3/domain.pddl
    problem_path: pddl/blocks-3/train.pddl
model:
  init_args:
    aux_loss_weight: 1.0
