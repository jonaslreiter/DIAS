# Per-domain config for 'miconic', composed after configs/main.yaml:
#   dias fit --config configs/main.yaml --config pddl/miconic/config.yaml
#
# The paths below are what make that command train miconic rather than
# whichever domain the base config happens to name. They must agree with
# pddl/domain-settings.yaml, which the test suite checks.
#
# Sampling stays at main.yaml's default; only the auxiliary weight is tuned.
data:
  init_args:
    domain_path: pddl/miconic/domain.pddl
    problem_path: pddl/miconic/train.pddl
model:
  init_args:
    aux_loss_weight: 1.0
