# Per-domain training overrides for 'hanoi'.
# Composed after configs/main.yaml, e.g.:
#   dias-train fit --config configs/main.yaml --config pddl/hanoi/config.yaml
# Holds domain-specific data (sampling) and model overrides.
data:
  init_args:
    min_per_label_train: 1000
    min_per_label_valid: 500
    max_per_label_train: 1000
    max_per_label_valid: 500
model:
  init_args:
    aux_loss_weight: 0.3
