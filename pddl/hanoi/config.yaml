# Per-domain config for 'hanoi', composed after configs/main.yaml:
#   dias fit --config configs/main.yaml --config pddl/hanoi/config.yaml
#
# The paths below are what make that command train hanoi rather than whichever domain the base config happens to name. They are this folder's standard filenames, which the test suite checks.
data:
  init_args:
    domain_path: pddl/hanoi/domain.pddl
    problem_path: pddl/hanoi/train.pddl
    min_per_label_train: 1000
    min_per_label_valid: 500
    max_per_label_train: 1000
    max_per_label_valid: 500
model:
  init_args:
    aux_loss_weight: 0.3
