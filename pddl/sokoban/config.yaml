# Per-domain config for 'sokoban', composed after configs/main.yaml:
#   dias fit --config configs/main.yaml --config pddl/sokoban/config.yaml
#
# The paths below are what make that command train sokoban rather than
# whichever domain the base config happens to name. They are this folder's
# standard filenames, which the test suite checks.
data:
  init_args:
    domain_path: pddl/sokoban/domain.pddl
    problem_path: pddl/sokoban/train.pddl
    min_per_label_train: 20
    min_per_label_valid: 10
    max_per_label_train: 1000
    max_per_label_valid: 500
model:
  init_args:
    aux_loss_weight: 1.0
