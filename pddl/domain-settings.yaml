# Per-domain manifest: the domain file and its problem list, nothing else.
#
# problems[0] is the training instance; validation uses the rest, sliced by
# problem_offset / num_problems in configs/validation.yaml. Per-domain training
# overrides live in <domain-folder>/config.yaml, Slurm resources in
# configs/slurm-resources.yaml, and the STRIPS+ argument positions in
# <domain-folder>/strips+.yaml, which is found beside the domain file rather
# than named here.

blocks-3:
  domain: pddl/blocks-3/domain.pddl
  problems:
    - pddl/blocks-3/train.pddl
    - pddl/blocks-3/test-1.pddl
    - pddl/blocks-3/test-2.pddl
    - pddl/blocks-3/test-3.pddl
