# Per-domain config for 'sokoban-pull', composed after configs/main.yaml:
#   dias fit --config configs/main.yaml --config pddl/sokoban-pull/config.yaml
#
# The paths below are what make that command train sokoban-pull rather than whichever domain the base config happens to name. They are this folder's standard filenames, which the test suite checks.
#
# Sampling stays at main.yaml's default; only the auxiliary weight is tuned.
data:
  init_args:
    domain_path: pddl/sokoban-pull/domain.pddl
    problem_path: pddl/sokoban-pull/train.pddl
model:
  init_args:
    aux_loss_weight: 1.0
