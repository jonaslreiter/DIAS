# Per-domain config for 'spanner', composed after configs/main.yaml:
#   dias fit --config configs/main.yaml --config pddl/spanner/config.yaml
#
# The paths below are what make that command train spanner rather than whichever domain the base config happens to name. They are this folder's standard filenames, which the test suite checks.
data:
  init_args:
    domain_path: pddl/spanner/domain.pddl
    problem_path: pddl/spanner/train.pddl
    min_per_label_train: 200
    min_per_label_valid: 100
    max_per_label_train: 1000
    max_per_label_valid: 500
model:
  init_args:
    aux_loss_weight: 0.1
